name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1.336.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: rails db:setup
      run: |
        cd spec/dummy
        RAILS_ENV=test bundle exec rails db:setup
    - name: Run the default task
      run: bundle exec rake
